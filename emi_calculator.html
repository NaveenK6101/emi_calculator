<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EMI Calculator – Flat vs Reducing</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0f1a;
    --surface: #131929;
    --surface2: #1a2236;
    --border: #243050;
    --flat-color: #f97316;
    --reducing-color: #22d3ee;
    --text: #e8eef8;
    --muted: #7a8fbb;
    --accent: #6366f1;
    --green: #10b981;
    --red: #ef4444;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .noise {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
  }

  .wrapper { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 2.5rem; }
  header h1 {
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--flat-color), var(--reducing-color));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  header p { color: var(--muted); font-size: .9rem; margin-top: .4rem; font-family: 'JetBrains Mono', monospace; }

  /* CONTROLS */
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem 2rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  .ctrl-group label {
    display: block;
    font-size: .72rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: .5rem;
  }
  .ctrl-group .value-display {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: .4rem;
  }
  .ctrl-group input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  .ctrl-group input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px rgba(99,102,241,.5);
  }
  .ctrl-group.flat input[type=range]::-webkit-slider-thumb { background: var(--flat-color); box-shadow: 0 0 8px rgba(249,115,22,.5); }
  .ctrl-group.reducing input[type=range]::-webkit-slider-thumb { background: var(--reducing-color); box-shadow: 0 0 8px rgba(34,211,238,.5); }

  /* SUMMARY CARDS */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem 1.5rem;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .card.flat::before { background: var(--flat-color); }
  .card.reducing::before { background: var(--reducing-color); }
  .card.diff::before { background: var(--accent); }
  .card small {
    font-size: .7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .07em;
    font-family: 'JetBrains Mono', monospace;
  }
  .card .big {
    font-size: 1.4rem;
    font-weight: 800;
    margin-top: .3rem;
    color: var(--text);
  }
  .card.flat .big { color: var(--flat-color); }
  .card.reducing .big { color: var(--reducing-color); }
  .card .sub { font-size: .8rem; color: var(--muted); margin-top: .2rem; }

  /* TABS */
  .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
  .tab-btn {
    padding: .5rem 1.2rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* TABLE */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: auto;
    max-height: 520px;
  }
  table { width: 100%; border-collapse: collapse; font-size: .83rem; }
  thead th {
    position: sticky; top: 0;
    background: var(--surface2);
    padding: .85rem 1rem;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th:first-child { text-align: center; }
  tbody tr { border-bottom: 1px solid rgba(36,48,80,.5); transition: background .15s; }
  tbody tr:hover { background: var(--surface2); }
  tbody td {
    padding: .7rem 1rem;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: .82rem;
    color: var(--text);
  }
  tbody td:first-child { text-align: center; color: var(--muted); font-size: .75rem; }
  .f-emi { color: var(--flat-color); font-weight: 600; }
  .r-emi { color: var(--reducing-color); font-weight: 600; }
  .f-int { color: rgba(249,115,22,.75); }
  .r-int { color: rgba(34,211,238,.75); }
  .f-bal { color: rgba(249,115,22,.55); }
  .r-bal { color: rgba(34,211,238,.55); }
  .saving { color: var(--green); font-weight: 600; }
  tfoot td {
    padding: .85rem 1rem;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: .8rem;
    font-weight: 700;
    background: var(--surface2);
    border-top: 2px solid var(--border);
    position: sticky; bottom: 0;
  }
  tfoot td:first-child { text-align: center; color: var(--muted); }

  /* LEGEND */
  .legend {
    display: flex; gap: 1.5rem; flex-wrap: wrap;
    margin-bottom: 1rem;
    font-size: .78rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
  }
  .legend span { display: flex; align-items: center; gap: .4rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  footer { text-align: center; margin-top: 2rem; color: var(--muted); font-size: .75rem; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="noise"></div>
<div class="wrapper">
  <header>
    <h1>EMI Calculator</h1>
    <p>Flat Rate &nbsp;⟷&nbsp; Reducing Balance — Side-by-Side</p>
  </header>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="ctrl-group">
      <label>Loan Amount (₹)</label>
      <div class="value-display" id="disp-amount">₹1,70,000</div>
      <input type="range" id="sl-amount" min="10000" max="10000000" step="5000" value="170000">
    </div>
    <div class="ctrl-group">
      <label>Tenure (Months)</label>
      <div class="value-display" id="disp-tenure">24 months</div>
      <input type="range" id="sl-tenure" min="3" max="300" step="1" value="24">
    </div>
    <div class="ctrl-group flat">
      <label>Flat Interest Rate (%)</label>
      <div class="value-display" id="disp-flat" style="color:var(--flat-color)">8.50%</div>
      <input type="range" id="sl-flat" min="1" max="30" step="0.10" value="8.5">
    </div>
    <div class="ctrl-group reducing">
      <label>Reducing Rate (%)</label>
      <div class="value-display" id="disp-red" style="color:var(--reducing-color)">17.00%</div>
      <input type="range" id="sl-red" min="1" max="40" step="0.10" value="17">
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="summary-grid" id="summary-grid"></div>

  <!-- TABLE -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="combined">Combined View</button>
    <button class="tab-btn" data-tab="flat">Flat Rate Only</button>
    <button class="tab-btn" data-tab="reducing">Reducing Balance Only</button>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:var(--flat-color)"></span> Flat Rate</span>
    <span><span class="dot" style="background:var(--reducing-color)"></span> Reducing Balance</span>
    <span><span class="dot" style="background:var(--green)"></span> Monthly Savings (Reducing vs Flat)</span>
  </div>

  <div class="table-wrap">
    <table id="emi-table">
      <thead id="tbl-head"></thead>
      <tbody id="tbl-body"></tbody>
      <tfoot id="tbl-foot"></tfoot>
    </table>
  </div>

  <footer>* Flat rate EMI = (P + P×r×n/12) / n &nbsp;|&nbsp; Reducing balance uses standard amortisation formula &nbsp;|&nbsp; All figures in Indian Rupees (₹)</footer>
</div>

<script>
  const fmt = v => '₹' + Math.round(v).toLocaleString('en-IN');
  const pct = v => v.toFixed(2) + '%';

  let state = { amount: 170000, tenure: 24, flatRate: 8.5, redRate: 17 };
  let activeTab = 'combined';

  function calcFlat(P, r, n) {
    const totalInterest = P * (r/100) * (n/12);
    const emi = (P + totalInterest) / n;
    const monthlyInterest = totalInterest / n;
    const principalPerMonth = P / n;
    const schedule = [];
    let bal = P;
    for (let i = 1; i <= n; i++) {
      bal -= principalPerMonth;
      schedule.push({
        month: i,
        emi: emi,
        principal: principalPerMonth,
        interest: monthlyInterest,
        balance: Math.max(0, bal)
      });
    }
    return { emi, totalInterest, totalPayment: P + totalInterest, schedule };
  }

  function calcReducing(P, annualRate, n) {
    const r = annualRate / 100 / 12;
    const emi = r === 0 ? P/n : P * r * Math.pow(1+r,n) / (Math.pow(1+r,n)-1);
    const schedule = [];
    let bal = P;
    let totalInterest = 0;
    for (let i = 1; i <= n; i++) {
      const intPart = bal * r;
      const prinPart = emi - intPart;
      bal = Math.max(0, bal - prinPart);
      totalInterest += intPart;
      schedule.push({ month: i, emi, principal: prinPart, interest: intPart, balance: bal });
    }
    return { emi, totalInterest, totalPayment: P + totalInterest, schedule };
  }

  function renderSummary(flat, red) {
    const { amount } = state;
    const saving = flat.totalInterest - red.totalInterest;
    const effFlat = (flat.totalInterest / amount / (state.tenure/12)) * 100;

    const cards = [
      { cls:'flat', label:'Flat Rate EMI', val: fmt(flat.emi), sub: `@ ${pct(state.flatRate)} flat` },
      { cls:'reducing', label:'Reducing EMI', val: fmt(red.emi), sub: `@ ${pct(state.redRate)} p.a.` },
      { cls:'flat', label:'Flat Total Interest', val: fmt(flat.totalInterest), sub: `Total payout: ${fmt(flat.totalPayment)}` },
      { cls:'reducing', label:'Reducing Total Interest', val: fmt(red.totalInterest), sub: `Total payout: ${fmt(red.totalPayment)}` },
      { cls:'diff', label:'Interest Saving', val: fmt(Math.abs(saving)), sub: saving>0 ? 'Reducing saves you this' : 'Flat saves you this' },
      { cls:'diff', label:'Effective Flat APR', val: pct(effFlat), sub: `Equivalent annual rate` },
    ];
    document.getElementById('summary-grid').innerHTML = cards.map(c =>
      `<div class="card ${c.cls}">
        <small>${c.label}</small>
        <div class="big">${c.val}</div>
        <div class="sub">${c.sub}</div>
      </div>`
    ).join('');
  }

  function renderTable(flat, red) {
    const n = state.tenure;
    const head = document.getElementById('tbl-head');
    const body = document.getElementById('tbl-body');
    const foot = document.getElementById('tbl-foot');

    let headers = '';
    if (activeTab === 'combined') {
      headers = `<tr>
        <th>Month</th>
        <th style="color:var(--flat-color)">EMI (F)</th>
        <th style="color:var(--flat-color)">Principal (F)</th>
        <th style="color:var(--flat-color)">Interest (F)</th>
        <th style="color:var(--flat-color)">Balance (F)</th>
        <th style="color:var(--reducing-color)">EMI (R)</th>
        <th style="color:var(--reducing-color)">Principal (R)</th>
        <th style="color:var(--reducing-color)">Interest (R)</th>
        <th style="color:var(--reducing-color)">Balance (R)</th>
        <th style="color:var(--green)">Saving</th>
      </tr>`;
    } else if (activeTab === 'flat') {
      headers = `<tr>
        <th>Month</th>
        <th>EMI</th><th>Principal</th><th>Interest</th><th>Balance</th>
      </tr>`;
    } else {
      headers = `<tr>
        <th>Month</th>
        <th>EMI</th><th>Principal</th><th>Interest</th><th>Balance</th>
      </tr>`;
    }
    head.innerHTML = headers;

    let rows = '';
    for (let i = 0; i < n; i++) {
      const f = flat.schedule[i];
      const r = red.schedule[i];
      const save = f.interest - r.interest;
      if (activeTab === 'combined') {
        rows += `<tr>
          <td>${i+1}</td>
          <td class="f-emi">${fmt(f.emi)}</td>
          <td>${fmt(f.principal)}</td>
          <td class="f-int">${fmt(f.interest)}</td>
          <td class="f-bal">${fmt(f.balance)}</td>
          <td class="r-emi">${fmt(r.emi)}</td>
          <td>${fmt(r.principal)}</td>
          <td class="r-int">${fmt(r.interest)}</td>
          <td class="r-bal">${fmt(r.balance)}</td>
          <td class="saving">${fmt(Math.abs(save))}</td>
        </tr>`;
      } else if (activeTab === 'flat') {
        rows += `<tr>
          <td>${i+1}</td>
          <td class="f-emi">${fmt(f.emi)}</td>
          <td>${fmt(f.principal)}</td>
          <td class="f-int">${fmt(f.interest)}</td>
          <td class="f-bal">${fmt(f.balance)}</td>
        </tr>`;
      } else {
        rows += `<tr>
          <td>${i+1}</td>
          <td class="r-emi">${fmt(r.emi)}</td>
          <td>${fmt(r.principal)}</td>
          <td class="r-int">${fmt(r.interest)}</td>
          <td class="r-bal">${fmt(r.balance)}</td>
        </tr>`;
      }
    }
    body.innerHTML = rows;

    // Footer totals
    if (activeTab === 'combined') {
      foot.innerHTML = `<tr>
        <td>TOTAL</td>
        <td class="f-emi">${fmt(flat.totalPayment)}</td>
        <td>${fmt(state.amount)}</td>
        <td class="f-int">${fmt(flat.totalInterest)}</td>
        <td>—</td>
        <td class="r-emi">${fmt(red.totalPayment)}</td>
        <td>${fmt(state.amount)}</td>
        <td class="r-int">${fmt(red.totalInterest)}</td>
        <td>—</td>
        <td class="saving">${fmt(flat.totalInterest - red.totalInterest)}</td>
      </tr>`;
    } else if (activeTab === 'flat') {
      foot.innerHTML = `<tr>
        <td>TOTAL</td>
        <td class="f-emi">${fmt(flat.totalPayment)}</td>
        <td>${fmt(state.amount)}</td>
        <td class="f-int">${fmt(flat.totalInterest)}</td>
        <td>—</td>
      </tr>`;
    } else {
      foot.innerHTML = `<tr>
        <td>TOTAL</td>
        <td class="r-emi">${fmt(red.totalPayment)}</td>
        <td>${fmt(state.amount)}</td>
        <td class="r-int">${fmt(red.totalInterest)}</td>
        <td>—</td>
      </tr>`;
    }
  }

  function update() {
    const flat = calcFlat(state.amount, state.flatRate, state.tenure);
    const red  = calcReducing(state.amount, state.redRate, state.tenure);
    renderSummary(flat, red);
    renderTable(flat, red);
  }

  function bindSlider(id, dispId, key, prefix, suffix, decimals) {
    const sl = document.getElementById(id);
    const disp = document.getElementById(dispId);
    sl.addEventListener('input', () => {
      state[key] = parseFloat(sl.value);
      disp.textContent = prefix + parseFloat(sl.value).toLocaleString('en-IN') + suffix;
      update();
    });
  }

  bindSlider('sl-amount',  'disp-amount', 'amount',   '₹', '',  0);
  bindSlider('sl-tenure',  'disp-tenure', 'tenure',   '',  ' months', 0);
  bindSlider('sl-flat',    'disp-flat',   'flatRate', '',  '%', 2);
  bindSlider('sl-red',     'disp-red',    'redRate',  '',  '%', 2);

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      update();
    });
  });

  update();
</script>
</body>
</html>
